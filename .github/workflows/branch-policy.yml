name: Branch policy
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout, no code from the PR, no interpolation in shell commands.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.base.ref === 'main' &&
                (pr.head.ref !== 'develop' || pr.head.repo?.full_name !== context.payload.repository.full_name)) {
              core.setFailed('main only accepts develop from this repository. Target develop instead.');
            }
